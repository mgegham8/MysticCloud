{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h2 class="fw-bold text-center mb-4">Final Step</h2>
                    <p class="text-muted text-center">
                        You are signing up with your Google account: <strong>{{ user.email }}</strong>
                    </p>
                    
                    <form class="signup" id="signup_form" method="post" action="{% url 'socialaccount_signup' %}">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-success btn-lg" type="submit">Complete Sign Up</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
