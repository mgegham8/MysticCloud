{% extends "base.html" %}

{% block content %}
<div class="container my-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 text-center">
                <div class="card-body p-5">
                    <i class="fab fa-google fa-3x text-danger mb-4"></i>
                    <h2 class="fw-bold mb-3">Sign In Via Google</h2>
                    <p class="text-muted mb-4">You are about to sign in using your Google account. Click continue to proceed.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg shadow-sm" type="submit">Continue</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
