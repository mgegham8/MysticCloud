{% if messages %}
    <div class="container mt-4" style="position: fixed; top: 80px; right: 20px; z-index: 9999; max-width: 400px;">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-lg border-0 rounded-4" role="alert">
                <div class="d-flex align-items-center">
                    {% if message.tags == 'success' %}
                        <i class="bi bi-check-circle-fill me-2"></i>
                    {% elif message.tags == 'error' or message.tags == 'danger' %}
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    {% else %}
                        <i class="bi bi-info-circle-fill me-2"></i>
                    {% endif %}
                    
                    <div>
                        {{ message }}
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>

    <script>
        // Ավտոմատ փակել հաղորդագրությունը 5 վայրկյան հետո
        setTimeout(function() {
            let alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                let bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 5000);
    </script>
{% endif %}
