<nav aria-label="Page navigation">
    <ul class="pagination d-flex justify-content-center align-items-center mt-5">
        {% if page_obj.has_previous %}
            <li class="page-item">
                <a href="?page={{ page_obj.previous_page_number }}" class="page-link shadow-sm">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item">
                <a href="?page={{ page_obj.previous_page_number }}" class="page-link">{{ page_obj.previous_page_number }}</a>
            </li>
        {% endif %}

        <li class="page-item active">
            <span class="page-link shadow-sm">{{ page_obj.number }}</span>
        </li>

        {% if page_obj.has_next %}
            <li class="page-item">
                <a href="?page={{ page_obj.next_page_number }}" class="page-link">{{ page_obj.next_page_number }}</a>
            </li>
            <li class="page-item">
                <a href="?page={{ page_obj.next_page_number }}" class="page-link shadow-sm">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        {% endif %}
    </ul>
</nav>

<style>
    .pagination .page-link {
        border: none;
        color: #37373f;
        margin: 0 5px;
        border-radius: 50% !important; /* Կլորավուն կոճակներ */
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
    }
    .pagination .page-item.active .page-link {
        background-color: #ce1212; /* MysticCloud Red */
        color: white;
    }
    .pagination .page-link:hover {
        background-color: #fce7e7;
        color: #ce1212;
    }
</style>
