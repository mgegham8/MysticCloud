{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- ======= Chefs Section ======= -->
<section id="chefs" class="chefs section-bg" style="padding-top: 100px;">
    <div class="container" data-aos="fade-up">

        <div class="section-header text-center mb-5">
            <h2 style="font-family: 'Amatic SC', cursive; font-size: 3rem;">Chefs</h2>
            <p>Our <span>Professional</span> Chefs</p>
        </div>

        <div class="row gy-4">
            {% for chef in our_chefs %}
            <div class="col-lg-4 col-md-6 d-flex align-items-stretch" data-aos="fade-up" data-aos-delay="{{ forloop.counter }}00">
                <div class="chef-member shadow-sm rounded-4 overflow-hidden bg-white" style="transition: 0.3s;">
                    <div class="member-img position-relative">
                        {% if chef.image %}
                            <img src="{{ chef.image.url }}" class="img-fluid w-100" alt="{{ chef.name }}" style="object-fit: cover; height: 350px;">
                        {% else %}
                            <img src="{% static 'img/default-chef.jpg' %}" class="img-fluid w-100" alt="Default Chef" style="object-fit: cover; height: 350px;">
                        {% endif %}

                        <div class="social position-absolute bottom-0 start-0 end-0 d-flex justify-content-center p-3" style="background: rgba(255,255,255,0.8); transform: translateY(100%); transition: 0.3s;">
                            <a href="" class="mx-2 text-dark"><i class="bi bi-twitter"></i></a>
                            <a href="" class="mx-2 text-dark"><i class="bi bi-facebook"></i></a>
                            <a href="" class="mx-2 text-dark"><i class="bi bi-instagram"></i></a>
                            <a href="" class="mx-2 text-dark"><i class="bi bi-linkedin"></i></a>
                        </div>
                    </div>
                    <div class="member-info p-4 text-center">
                        <h4 style="font-weight: 700; color: #37373f;">{{ chef.name }}</h4>
                        <span style="color: #ce1212; font-style: italic; font-size: 14px;">Master Chef</span>
                        <p class="mt-3 text-muted" style="font-size: 14px;">{{ chef.bio }}</p>
                    </div>
                </div>
            </div><!-- End Chefs Member -->
            {% endfor %}
        </div>

    </div>
</section>

<style>
    .chef-member:hover {
        transform: translateY(-10px);
        box-shadow: 0px 10px 30px rgba(0,0,0,0.1) !important;
    }
    .chef-member:hover .social {
        transform: translateY(0) !important;
    }
    .chef-member .social a:hover {
        color: #ce1212 !important;
    }
</style>
{% endblock %}
