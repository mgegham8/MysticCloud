{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/success.css' %}">
{% endblock %}

{% block content %}
<div class="status-viewport">
    <div class="success-card-modern">
        
        <!-- Success Icon -->
        <div class="icon-wrap">
            <i class="bi bi-shield-check"></i> 
        </div>

        <!-- Content -->
        <h1>All Done!</h1>
        <p>
            Your password has been successfully updated. <br>
            Secure access to your <strong>MysticCloud</strong> account is restored.
        </p>

        <!-- Button -->
        <a href="{% url 'users:login' %}" class="btn-continue">
            Continue to Login
        </a>

    </div>
</div>
{% endblock %}
