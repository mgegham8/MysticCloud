{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-viewport">
    <div class="auth-card">

        <!-- Icon & Title -->
        <div class="text-center mb-4">
            <div style="font-size: 2.5rem; color: #ce1212;">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1 class="auth-title">Secure Your Account</h1>
            <p class="text-muted small">Enter your new password below</p>
        </div>

        <!-- Password Change Form -->
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                {{ form|crispy }}
            </div>

            <button type="submit" class="btn-auth-submit">
                Update Password
            </button>
        </form>

        <!-- Footer link -->
        <div class="text-center mt-4">
            <a href="{% url 'users:user_profile' %}" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Profile
            </a>
        </div>

    </div>
</div>
{% endblock %}
